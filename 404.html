  <style>
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .error-page {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
      position: relative;
      overflow: hidden;
    }

    .error-container {
      max-width: 700px;
      width: 100%;
      position: relative;
      z-index: 2;
      animation: fadeInUp 0.8s ease forwards;
    }

    .error-code {
      font-size: 10rem;
      font-weight: 900;
      line-height: 1;
      background: linear-gradient(135deg, var(--primary-green) 0%, var(--accent-green) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 10px;
      position: relative;
      display: inline-block;
    }

    .error-code::after {
      content: "404";
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, var(--bamboo-gold) 0%, #00FF66 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      opacity: 0;
      animation: glitch 2s infinite;
    }

    @keyframes glitch {
      0% {
        opacity: 0;
        transform: translate(0);
      }

      20% {
        opacity: 0.2;
        transform: translate(-3px, 3px);
      }

      40% {
        opacity: 0;
        transform: translate(3px, -3px);
      }

      60% {
        opacity: 0.15;
        transform: translate(-2px, -2px);
      }

      80% {
        opacity: 0;
        transform: translate(2px, 2px);
      }

      100% {
        opacity: 0;
        transform: translate(0);
      }
    }

    .error-title {
      font-size: 2rem;
      color: #00FF66 !important;
      margin-bottom: 20px;
      font-weight: 800;
      text-shadow: 0 0 15px rgba(0, 255, 102, 0.35);
    }

    .error-message {
      font-size: 1.2rem;
      color: #f8f9fa !important;
      margin-bottom: 40px;
      line-height: 1.8;
    }

    .error-message .emoji {
      font-size: 2.5rem;
      display: inline-block;
      animation: bounce 2s infinite;
    }

    @keyframes bounce {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-15px);
      }
    }

    .error-logo-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 25px auto 15px auto;
      position: relative;
      width: 170px;
      height: 170px;
      border-radius: 50%;
      padding: 4px;
      background: radial-gradient(circle, rgba(0, 255, 102, 0.25) 0%, rgba(22, 22, 26, 0.95) 100%);
      border: 3px solid #00FF66;
      box-shadow: 0 0 30px rgba(0, 255, 102, 0.4), 0 10px 25px rgba(0, 0, 0, 0.3), inset 0 0 15px rgba(0, 255, 102, 0.3);
      overflow: hidden;
      z-index: 2;
    }

    .error-logo {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      transition: transform 0.3s ease, filter 0.3s ease;
    }

    .error-logo:hover {
      transform: scale(1.04);
      filter: drop-shadow(0 0 20px rgba(0, 255, 102, 0.6)) brightness(1.08);
    }

    .error-logo-glow {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 220px;
      height: 220px;
      background: radial-gradient(circle, rgba(0, 255, 102, 0.35) 0%, transparent 70%);
      border-radius: 50%;
      animation: pulseGlow 3s ease-in-out infinite alternate;
      z-index: 1;
      pointer-events: none;
    }

    @keyframes pulseGlow {
      0% {
        transform: translate(-50%, -50%) scale(0.9);
        opacity: 0.5;
      }
      100% {
        transform: translate(-50%, -50%) scale(1.15);
        opacity: 0.85;
      }
    }

    .error-speech {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #16161a;
      border-radius: 25px;
      padding: 8px 20px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      font-size: 0.95rem;
      font-weight: 600;
      color: #f8f9fa;
      margin: 10px auto 20px auto;
      border: 1px solid rgba(0, 255, 102, 0.4);
      text-align: center;
    }

    .error-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      margin-top: 30px;
    }

    .btn-home {
      background: linear-gradient(135deg, #00FF66 0%, #00b34a 100%) !important;
      color: #0a0a0a !important;
      padding: 15px 35px;
      border-radius: 8px;
      font-weight: 800;
      text-decoration: none;
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 15px rgba(0, 255, 102, 0.35);
    }

    .btn-home:hover {
      transform: translateY(-5px);
      background: #33ff85 !important;
      color: #0a0a0a !important;
      box-shadow: 0 8px 25px rgba(0, 255, 102, 0.5);
    }

    .btn-faq {
      background: rgba(255, 255, 255, 0.08) !important;
      border: 1.5px solid rgba(255, 255, 255, 0.3) !important;
      color: #ffffff !important;
      padding: 15px 35px;
      border-radius: 8px;
      font-weight: 700;
      text-decoration: none;
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .btn-faq:hover {
      background: rgba(255, 255, 255, 0.2) !important;
      border-color: #00FF66 !important;
      color: #ffffff !important;
      transform: translateY(-5px);
    }

    @media (max-width: 768px) {
      .error-code {
        font-size: 6rem;
      }

      .error-title {
        font-size: 1.5rem;
      }

      .error-message {
        font-size: 1rem;
      }

      .error-logo {
        width: 130px;
        height: 118px;
      }

      .error-speech {
        font-size: 0.8rem;
        padding: 8px 14px;
        top: -25px;
        right: 10px;
      }

      .error-actions {
        flex-direction: column;
        align-items: center;
      }
    }
  </style>
