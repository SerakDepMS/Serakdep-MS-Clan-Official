<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Terminal · Serakdep MS · Archivo Histórico · v18.0</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/lore.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Cinzel:wght@500;600;700;900&display=swap" rel="stylesheet" />
</head>
<body>

  <div id="boot-overlay">
    <div class="boot-galaxy" aria-hidden="true">
      <div class="galaxy-nebula"></div>
      <div class="galaxy-arms"></div>
      <div class="galaxy-stars-far"></div>
      <div class="galaxy-stars-near"></div>
      <div class="galaxy-core-glow"></div>
    </div>
    <div class="boot-particles" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span>
    </div>
    <div class="boot-container">
      <div class="boot-title glitch-text">SERAKDEP MS</div>
      <div class="boot-sub">INICIALIZANDO SISTEMA...</div>
      <div class="boot-progress">
        <span class="boot-percent" id="boot-percent">0%</span>
        <div class="boot-bar"><div class="boot-fill" id="boot-fill"></div></div>
      </div>
      <div class="boot-messages" id="boot-messages">
        <div class="boot-line">Cargando núcleo...</div>
      </div>
      <div class="boot-footer">0x7F3A9B2C · v18.0 ULTRA</div>
    </div>
  </div>


  <div id="shutdown-overlay">
    <div class="shutdown-text glitch-text">SESIÓN CERRADA</div>
    <div class="shutdown-sub">Desconectando...</div>
  </div>


  <div id="terminal-container">
    <div id="terminal-header">
      <span class="terminal-dot red"></span>
      <span class="terminal-dot yellow"></span>
      <span class="terminal-dot green"></span>
      <span class="terminal-title">SERAKDEP_MS · LORE_TERMINAL v18.0</span>
      <span class="terminal-time" id="term-time">00:00:00</span>
      <span class="terminal-session" id="term-session">00:00</span>
      <button id="exit-btn" title="Apagar"><i class="fas fa-power-off"></i></button>
    </div>

    <div id="chapter-progress" aria-hidden="true">
      <div id="chapter-progress-fill"></div>
    </div>

    <div id="terminal-body">
      <div id="terminal-output"></div>
      <div id="terminal-cursor">
        <span class="cursor-symbol">⨠</span>
        <span class="cursor-blink">▌</span>
      </div>
    </div>

    <div id="terminal-footer">
      <button id="prev-btn" title="← Anterior"><i class="fas fa-chevron-left"></i></button>
      <span id="chapter-indicator">01 / 26</span>
      <button id="next-btn" title="Siguiente →"><i class="fas fa-chevron-right"></i></button>
      <span class="footer-hint">← → · Enter · Ctrl+Home / Ctrl+End</span>
    </div>
  </div>

  <script src="js/lore.js" defer></script>
</body>
</html>
